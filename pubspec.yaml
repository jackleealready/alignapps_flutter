name: alignapps_flutter
description: Flutter bridge for the AlignApps attribution SDK (Android + iOS).
version: 0.3.2
homepage: https://github.com/alignapps/alignapps-sdk-android
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.alignapps.flutter
        pluginClass: AlignappsFlutterPlugin
      ios:
        pluginClass: AlignappsFlutterPlugin
